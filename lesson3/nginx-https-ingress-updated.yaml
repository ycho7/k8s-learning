
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: helm-lab
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nginx.lab.local
      secretName: nginx-tls-auto
  rules:
    - host: nginx.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
